name: Deploy Docusaurus site to GitHub Pages

on:
  push:
    branches:
      - main  # 当 main 分支有推送时触发部署
  workflow_dispatch: # 允许手动触发

# 部署串行执行，不取消进行中的任务：取消可能留下半套 gh-pages 产物
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted  # 绕开组织 Actions 计费(同 rdk_x_doc)
    timeout-minutes: 30

    steps:
    # runner 到 github.com 偶发断连；先做 30 秒内的可达性探测，失败立即退出
    - name: Probe github.com egress
      run: |
        for i in 1 2 3; do
          if curl -sS --max-time 10 -o /dev/null https://github.com; then
            echo "github.com reachable (attempt $i)"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 5
        done
        echo "::error::github.com unreachable from runner"
        exit 1

    - name: Tune Git for unstable network
      run: |
        git config --global http.postBuffer 524288000
        git config --global http.version HTTP/1.1
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 600

    - name: Checkout repository
      id: checkout
      uses: actions/checkout@v4
      continue-on-error: true
      timeout-minutes: 15

    - name: Retry checkout repository
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v4
      timeout-minutes: 15

    - name: Detect local Node.js on runner
      id: detect_node
      run: |
        if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
          echo "has_node=true" >> "$GITHUB_OUTPUT"
          echo "Using local Node.js:"
          node -v
          npm -v
        else
          echo "has_node=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js (fallback)
      if: steps.detect_node.outputs.has_node != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci

    - name: Build Docusaurus site
      run: npm run build

    - name: Set up Git config
      run: |
        git config --global user.email "2560288119@qq.com"
        git config --global user.name "liqinglian01"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Deploy to GitHub Pages
      run: USE_SSH=true npm run deploy
