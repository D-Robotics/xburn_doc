name: CI Check

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            docs/**/*.{md,mdx}
            blog/**/*.{md,mdx}

  custom-checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Detect local Node.js on runner
        id: detect_node
        run: |
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "Using local Node.js:"
            node -v
            npm -v
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js (fallback if runner has no Node)
        if: steps.detect_node.outputs.has_node != 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Filename & directory lint
        run: bash scripts/check-filenames.sh
      - name: Frontmatter coverage
        run: node scripts/check-frontmatter.js
      - name: Placeholder check
        run: bash scripts/check-placeholder.sh

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Detect local Node.js on runner
        id: detect_node
        run: |
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "Using local Node.js:"
            node -v
            npm -v
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js (fallback if runner has no Node)
        if: steps.detect_node.outputs.has_node != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci
      - name: Build site (strict broken-link checking)
        run: npm run build:ci
      - name: Link Checker (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --base ${{ github.workspace }}/build
            --accept 200,204,301,302,429
            --timeout 30
            --max-retries 2
            ./build/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
